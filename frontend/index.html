<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mutation Domino explores wild-type structural context for protein missense variants. Research and education only."
    />
    <title>Mutation Domino — structural context explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('mutation-domino-theme');
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
          if (resolved === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = resolved;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
